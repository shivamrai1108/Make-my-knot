[variables]
NIXPACKS_NODEJS_VERSION = "18"

# Declare providers as an array
providers = ["node"]

[phases.install]
cmd = "npm ci --only=production"

[phases.build]
cmd = "echo 'Backend build complete'"

[phases.start]
cmd = "bash start.sh"

# Move provider-specific configuration into phases or environment vars if needed
# Nixpacks automatically detects npm/package.json, so you can remove this:
# [providers.node]
# packageManager = "npm"
# packageFilePath = "./package.json"
